name: Weekly video pipeline
on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Exact Notion Week value (blank advances approved stages only)'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: video-pipeline
  cancel-in-progress: false
jobs:
  produce:
    # Enable after credentials, assets and Notion approval options are configured.
    if: github.event_name == 'workflow_dispatch' || vars.VIDEO_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIDEO_WEEK: ${{ github.event.inputs.week || vars.VIDEO_WEEK }}
      TEXT_MODEL: gpt-4.1-mini
      TTS_MODEL: gpt-4o-mini-tts
      BODY_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "CHROMIUM=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Process one eligible task
        run: python pipeline.py
      - name: Save previews and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 90
